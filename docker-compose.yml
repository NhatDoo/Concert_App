version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: concert-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nhat123456789
      POSTGRES_DB: concert
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: concert-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: concert-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Nhat123456789
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: concert-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./concertapp
      dockerfile: Dockerfile
    container_name: concert-backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - minio
      - elasticsearch
    environment:
      DATABASE_URL: "postgresql://postgres:Nhat123456789@postgres:5432/concert"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_NODE: "http://elasticsearch:9200"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Nhat123456789
      JWT_REFRESH_SECRET: "59efedfdabdd1cfb6321d61887a52e73b65db593e961a35cbc6e8db80972631237dda83d0f9d88cb9db094f066e6f8d98351a86c6d813fd6d60d61a1e2f06317"
      JWT_REFRESH_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3001"

  frontend:
    build:
      context: ./fontend
      dockerfile: Dockerfile
    container_name: concert-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
