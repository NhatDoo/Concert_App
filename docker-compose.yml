version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: concert-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Nhat123456789}
      POSTGRES_DB: ${POSTGRES_DB:-concert}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: concert-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: concert-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Nhat123456789}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: concert-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./concertapp
      dockerfile: Dockerfile
    container_name: concert-backend
    ports:
      - "3001:3001"
      - "51212:51212"
    depends_on:
      - postgres
      - redis
      - minio
      - elasticsearch
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Nhat123456789}@postgres:5432/${POSTGRES_DB:-concert}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_NODE: "http://elasticsearch:9200"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-Nhat123456789}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: "7d"
      JWT_EXPIRES_IN: "1d"
      FRONTEND_URL: "${FRONTEND_URL}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      CODESPACE_NAME: ${CODESPACE_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL}"
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      DEFAULT_OAUTH_PASSWORD_HASH: ${DEFAULT_OAUTH_PASSWORD_HASH}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

  frontend:
    build:
      context: ./fontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: concert-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      CODESPACE_NAME: ${CODESPACE_NAME}

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
