services:
  redis:
    image: redis:7-alpine
    container_name: concert-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: concert-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./concertapp
      dockerfile: Dockerfile
    container_name: concert-backend
    depends_on:
      - redis
      - elasticsearch
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must contain the Neon connection string}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:?AWS_ENDPOINT_URL_S3 must contain the Neon storage endpoint}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_NODE: "http://elasticsearch:9200"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: "7d"
      JWT_EXPIRES_IN: "1d"
      FRONTEND_URL: "${FRONTEND_URL}"
      CODESPACE_NAME: ${CODESPACE_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL}"
      VNP_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      DEFAULT_OAUTH_PASSWORD_HASH: ${DEFAULT_OAUTH_PASSWORD_HASH}

  frontend:
    build:
      context: ./fontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: concert-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api

  nginx:
    image: nginx:1.27-alpine
    container_name: concert-nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  elasticsearch_data:
